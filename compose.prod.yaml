services:
  api:
    command:
      [
        "sh",
        "-c",
        "node dist/database/run-migrations.js && node dist/main.js",
      ]
    environment:
      EVDP_ALLOW_LOCAL_DEFAULT_PASSWORDS: "false"
      NODE_ENV: production
      # 清除 compose.yaml 面向本地 Docker Desktop 的 Node 堆上限。
      NODE_OPTIONS: !reset null
    # 生产容量由服务器/编排层按实测负载配置，不继承本地开发机的内存上限。
    mem_limit: !reset null

  web:
    image: evdp-web:${EVDP_RELEASE_VERSION:-dev}
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        EVDP_RELEASE_VERSION: ${EVDP_RELEASE_VERSION:-dev}
        EVDP_GIT_SHA: ${EVDP_GIT_SHA:-unknown}
        EVDP_BUILD_TIME: ${EVDP_BUILD_TIME:-unknown}
    environment:
      BACKEND_INTERNAL_URL: http://api:4000/api/v1
      NODE_ENV: production
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3000/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_HOST_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
