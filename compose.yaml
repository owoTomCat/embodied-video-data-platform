name: ${COMPOSE_PROJECT_NAME:-evdp}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    image: evdp-api:${EVDP_RELEASE_VERSION:-dev}
    build:
      context: ./backend
      target: api
      args:
        EVDP_RELEASE_VERSION: ${EVDP_RELEASE_VERSION:-dev}
        EVDP_GIT_SHA: ${EVDP_GIT_SHA:-unknown}
        EVDP_BUILD_TIME: ${EVDP_BUILD_TIME:-unknown}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      EVDP_ALLOW_LOCAL_DEFAULT_PASSWORDS: "true"
      EVDP_AUTO_RECLAIM_WORKER_TIMEOUTS: "true"
      VIDEO_QUALITY_PROMPT_PATH: /quality/prompts/qwen-video-ai-quality-framework-v2/manifest.json
      # 限制 Node 堆内存，避免长期运行后内存/句柄泄漏拖垮容器
      NODE_OPTIONS: "--max-old-space-size=1024"
    ports:
      - "127.0.0.1:4000:4000"
    # 有界失败：线程数/内存超限时由内核终止容器，restart 策略自动拉起，
    # 避免进程挂死数天后只能靠重启 Docker Desktop 恢复
    pids_limit: 200
    mem_limit: 1536m
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=4294967296,mode=1777
    volumes:
      - ./docs/quality:/quality:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:4000/api/v1/health/ready >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  media-worker:
    image: evdp-media-worker:${EVDP_RELEASE_VERSION:-dev}
    build:
      context: ./backend
      target: media-worker
      args:
        EVDP_RELEASE_VERSION: ${EVDP_RELEASE_VERSION:-dev}
        EVDP_GIT_SHA: ${EVDP_GIT_SHA:-unknown}
        EVDP_BUILD_TIME: ${EVDP_BUILD_TIME:-unknown}
    env_file:
      - .env
    environment:
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp:size=3221225472,mode=1777
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  ai-quality-worker:
    image: evdp-ai-quality-worker:${EVDP_RELEASE_VERSION:-dev}
    init: true
    build:
      context: ./backend
      target: ai-quality-worker
      args:
        EVDP_RELEASE_VERSION: ${EVDP_RELEASE_VERSION:-dev}
        EVDP_GIT_SHA: ${EVDP_GIT_SHA:-unknown}
        EVDP_BUILD_TIME: ${EVDP_BUILD_TIME:-unknown}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      AI_QUALITY_CONCURRENCY: 3
      AI_QUALITY_MODEL_TIMEOUT_MS: 600000
      VIDEO_QUALITY_PROMPT_PATH: /quality/prompts/qwen-video-ai-quality-framework-v2/manifest.json
    read_only: true
    tmpfs:
      - /tmp:size=3221225472,mode=1777
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./docs/quality:/quality:ro
    restart: unless-stopped

  ai-quality-lab:
    image: evdp-ai-quality-lab:${EVDP_RELEASE_VERSION:-dev}
    profiles: ["ai-test"]
    init: true
    build:
      context: ./backend
      target: ai-quality-lab
      args:
        EVDP_RELEASE_VERSION: ${EVDP_RELEASE_VERSION:-dev}
        EVDP_GIT_SHA: ${EVDP_GIT_SHA:-unknown}
        EVDP_BUILD_TIME: ${EVDP_BUILD_TIME:-unknown}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      QUALITY_LAB_HOST: 0.0.0.0
      QUALITY_LAB_PORT: 4010
      VIDEO_QUALITY_PROMPT_PATH: /quality/prompts/qwen-video-ai-quality-framework-v2/manifest.json
      QUALITY_LAB_HISTORY_PATH: /data/quality-lab/jobs.json
      QUALITY_LAB_HISTORY_RETENTION_DAYS: 30
    ports:
      - "127.0.0.1:4010:4010"
    read_only: true
    tmpfs:
      - /tmp:size=3221225472,mode=1777
    volumes:
      - ./docs/quality:/quality:ro
      - ./Data:/samples:ro
      - quality_lab_data:/data/quality-lab
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:4010/api/health >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  quality_lab_data:
